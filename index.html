<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>China 2026</title>
<meta name="theme-color" content="#B3362A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="China 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: uma coluna de app (máx. 560px), cabeçalho fixo com relógio da China e faixa de dias, abas embaixo. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunk:#E3E8E1; --ink:#1A1F1C; --muted:#5C665F; --line:#D3D9D1;
  --accent:#B3362A; --accent-ink:#FFFFFF; --jade:#2C7660; --gold:#9A6C12; --sky:#2B618A; --plum:#7A4A7E;
  --ok-bg:#DDEFE6; --warn-bg:#F8ECD3; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.07);
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#181E1B; --sunk:#202824; --ink:#E7ECE8; --muted:#9AA69F; --line:#2B3430;
  --accent:#E06450; --accent-ink:#1A0F0C; --jade:#5BB797; --gold:#D6A84C; --sky:#72AAD3; --plum:#C292C6;
  --ok-bg:#1D3A2F; --warn-bg:#3A2F17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#181E1B; --sunk:#202824; --ink:#E7ECE8; --muted:#9AA69F; --line:#2B3430;
  --accent:#E06450; --accent-ink:#1A0F0C; --jade:#5BB797; --gold:#D6A84C; --sky:#72AAD3; --plum:#C292C6;
  --ok-bg:#1D3A2F; --warn-bg:#3A2F17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.seal{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 17px/1 var(--f-zh);flex:none}
.brand{font:800 17px/1.1 var(--f-disp);letter-spacing:-.01em}
.brand small{display:block;font:500 11.5px/1.2 var(--f-body);color:var(--muted);letter-spacing:0}
.clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.clock b{font:700 15px var(--f-body)}
.clock span{display:block;font-size:11px;color:var(--muted)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:5px;vertical-align:1px}
.sync.ok{background:var(--jade)} .sync.warn{background:var(--gold)} .sync.err{background:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:none;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px 6px;text-align:left;cursor:pointer;min-width:62px;position:relative}
.dchip .w{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dchip .n{font:700 15px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.dchip .c{font-size:11px;color:var(--muted);white-space:nowrap}
.dchip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-current="true"] .w,.dchip[aria-current="true"] .c{color:inherit;opacity:.75}
.dchip.today::after{content:"hoje";position:absolute;top:-7px;right:6px;background:var(--accent);color:var(--accent-ink);font:700 9px/1 var(--f-body);padding:3px 5px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase}
.dchip.move .n::after{content:" ↗";font-size:11px;color:var(--jade)}
.dchip[aria-current="true"].move .n::after{color:inherit}

/* herói do dia */
.hero{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:16/10;max-width:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72));pointer-events:none}
.hero .txt{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.hero .zhbig{position:absolute;right:12px;top:8px;font:900 44px/1 var(--f-zh);color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.35);writing-mode:vertical-rl;letter-spacing:.08em}
.hero h1{font:800 26px/1.05 var(--f-disp);margin:2px 0 4px;text-wrap:balance;letter-spacing:-.015em}
.hero .meta{font-size:12.5px;opacity:.92}
.hero .cap{font-size:11px;opacity:.75;margin-top:4px}
.dots{position:absolute;top:12px;left:14px;display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)} .dots i.on{background:#fff}
.hero.noimg{aspect-ratio:auto;padding:18px 14px 14px;background:var(--ink)} .hero.noimg .txt{position:static}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.plan span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

/* agora */
.now{margin-top:12px;border-radius:12px;background:var(--ink);color:var(--bg);padding:10px 12px;display:grid;gap:2px}
.now small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.now b{font-weight:600}

/* seções */
h2.sec{font:700 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-weight:600;letter-spacing:0;text-transform:none}
h2.sec button{margin-left:auto}
.lnkbtn{background:none;border:0;color:var(--sky);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;text-transform:none;letter-spacing:0}

/* linha do tempo */
.tl{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.it{display:grid;grid-template-columns:52px 1fr 36px;gap:0 10px;padding:11px 12px 11px 12px;border-top:1px solid var(--line);align-items:start;position:relative}
.it:first-child{border-top:0}
.it .t{font:700 14px/1.35 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.it .body{min-width:0;cursor:pointer}
.it .ttl{font-weight:500;line-height:1.35}
.it .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.it .tag{display:inline-block;font:700 10px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:4px;margin-right:6px;vertical-align:1px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.it.k-passeio{--c:var(--jade)} .it.k-comida{--c:var(--accent)} .it.k-compras{--c:var(--plum)} .it.k-transporte{--c:var(--sky)} .it.k-trem{--c:var(--sky)} .it.k-nota{--c:var(--gold)} .it.k-hotel{--c:var(--muted)}
.it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.0}
.it.cur::before{opacity:1}
.it.cur{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.it.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.it.hid{opacity:.55}
.it .mine{font-size:10.5px;color:var(--gold);font-weight:700;margin-left:4px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;justify-self:end}
.chk svg{width:15px;height:15px;opacity:0}
.it.done .chk{background:var(--jade);border-color:var(--jade);color:var(--surface)} .it.done .chk svg{opacity:1}
.opts{margin-top:8px;display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.opt b{font-weight:600}
.zh{font-family:var(--f-zh);font-weight:600}
.opt .zh{margin-left:6px;color:var(--muted)}
.opt p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.pill.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.warn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.empty{padding:18px 14px;color:var(--muted);text-align:center}

/* cartões */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px}
.card + .card{margin-top:8px}
.card h3{font:700 16px/1.25 var(--f-disp);margin:0 0 4px;letter-spacing:-.005em}
.card p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.status{display:inline-block;font:700 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.status.ok{background:var(--ok-bg);color:var(--jade)} .status.todo{background:var(--warn-bg);color:var(--gold)}
.trn{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline;margin-top:8px;font-variant-numeric:tabular-nums}
.trn .hh{font:800 22px/1 var(--f-disp)} .trn .st{font-size:13.5px} .trn .du{font-size:12px;color:var(--muted)}
.mv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0;padding-top:0}
.mv b{font-weight:600;font-size:14px} .mv .how{font-size:12.5px;color:var(--muted);grid-column:1} .mv .tm{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} .mv .co{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.zhaddr{font:600 15px/1.5 var(--f-zh);color:var(--ink);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;word-break:break-all}
.alert{background:var(--warn-bg);border-radius:10px;padding:9px 12px;font-size:13.5px}
.alert + .alert{margin-top:6px}
ul.tips{margin:0;padding-left:18px;font-size:14px} ul.tips li + li{margin-top:5px}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";margin-left:auto;font:700 18px/1 var(--f-body);color:var(--muted)}
details.card[open] summary::after{content:"–"}
.idea + .idea{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.idea b{font-weight:600}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;z-index:31;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(179,54,42,.35);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}

/* folha (formulário) e cartão para mostrar */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
/* folha em 3 partes: título, campos (rolam) e botões (sempre visíveis) */
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:calc(100% - 12px);display:flex;flex-direction:column;overflow:hidden}
.sheet .shead,.sheet .sbody,.sheet .sfoot{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .shead{padding-block:14px 8px;display:flex;align-items:center;gap:10px}
.sheet h3{font:800 19px/1.2 var(--f-disp);margin:0}
.sheet .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--sunk);font-size:20px;line-height:1;cursor:pointer;flex:none}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:2px 6px}
.sheet .sfoot{padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface)}
.sheet .sfoot .pill{padding:10px 16px;font-size:14px}
.sheet .sfoot .pri{flex:1;justify-content:center}
.fld{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.fld label,.fld .lb{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld textarea,.fld select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px}
.fld textarea{min-height:56px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.row2 > .fld{overflow:hidden}
/* iPhone: o campo de hora nativo tem largura mínima própria e invadia o campo do lado */
.fld input[type=time],.fld select{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;height:44px;line-height:22px;text-align:left}
.fld input[type=time]::-webkit-date-and-time-value{text-align:left}
.fld select{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,#8a948e 50%),linear-gradient(135deg,#8a948e 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more{margin:0 0 10px}
.more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sky);list-style:none;padding:4px 0}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:8px}
.show{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px))}
.show .big{font:900 clamp(34px,11vw,64px)/1.25 var(--f-zh);word-break:break-all;max-width:100%}
.show .mid{font:600 clamp(20px,6vw,30px)/1.4 var(--f-zh);margin-top:16px;max-width:100%;word-break:break-all}
.show .pt{font-size:15px;color:#555;margin-top:16px}
.show .py{font-size:18px;color:#333;margin-top:8px}
.showacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px}
.showacts svg{width:18px;height:18px;margin-right:6px;vertical-align:-3px}
.show .showacts button{margin-top:0}
.show button.on{background:#B3362A;color:#fff;border-color:#B3362A}
.phr.tts{grid-template-columns:1fr auto 40px}
.phr.tts .z{grid-column:2}
.say{grid-row:1/3;grid-column:3;align-self:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.say svg{width:19px;height:19px}
.say.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.show button{margin-top:28px;border:1px solid #ccc;background:#f3f3f3;color:#111;border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.banner{margin-top:10px;font-size:12.5px;background:var(--warn-bg);border-radius:10px;padding:8px 11px}

/* frases e info */
.phr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.phr:first-child{border-top:0;padding-top:2px}
.phr .p{font-weight:600} .phr .y{font-size:12.5px;color:var(--muted);grid-column:1}
.phr .z{grid-row:1/3;grid-column:2;font:600 19px/1.3 var(--f-zh);align-self:center;text-align:right}
.know h3{font-size:15px}
.num{font:800 24px/1 var(--f-disp);font-variant-numeric:tabular-nums}
/* login e conta */
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
.auth{max-width:420px;margin:0 auto;padding-block:48px 40px;min-height:100%}
.auth .seal{width:56px;height:56px;font-size:32px;border-radius:12px}
.auth h1{font:800 30px/1.05 var(--f-disp);margin:16px 0 6px;letter-spacing:-.02em}
.auth p.lead{color:var(--muted);margin:0 0 22px}
.auth .seg{margin-bottom:16px;margin-right:0}
.auth .fld input{font-size:16px}
.auth .pill.pri{width:100%;justify-content:center;padding:12px 16px;font-size:15px}
.err{color:var(--accent);font-size:13.5px;margin:4px 0 10px;min-height:1em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-body);color:#fff;background:var(--c,#2C7660);flex:none}
.switch{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch span{flex:1;min-width:0} .switch small{display:block;color:var(--muted);font-size:12.5px}
.switch input[type=checkbox]{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input[type=checkbox]:checked{background:var(--jade)} .switch input[type=checkbox]:checked::after{transform:translateX(18px)}
.switch select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px}
.by{font-size:10.5px;font-weight:700;margin-left:4px;color:var(--c,var(--gold))}
.tabs nav{grid-template-columns:repeat(6,1fr)!important}
.tabs button{font-size:10.5px!important;padding-inline:0!important}

/* fotos */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px 10px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchips small{font-weight:500;opacity:.7;margin-left:3px}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:12px;overflow:hidden}
.ph{aspect-ratio:1;border:0;padding:0;background:var(--sunk);cursor:pointer;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .who{position:absolute;left:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font:700 9px/18px var(--f-body);text-align:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.8)}
.phup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.phup label.pill{cursor:pointer}
.phday{font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 7px}
.pv{position:fixed;inset:0;z-index:60;background:#050505;color:#fff;display:flex;flex-direction:column}
.pvtop{display:flex;justify-content:space-between;align-items:center;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;opacity:.85}
.pvtop button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.pvimg{flex:1;min-height:0;display:grid;place-items:center;touch-action:pan-y}
.pvimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pvbar{padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pvbar p{margin:0 0 4px;font-size:14px}
.pvbar .meta{font-size:12.5px;opacity:.7}
.pvbar .pill{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.pvbar .pill.pri{background:#fff;color:#111;border-color:#fff}
.pvbar .pill.warn{color:#FF9A8B}
.pvbar input{width:100%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 11px;font-size:16px;margin:6px 0}
.pvnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:28px;cursor:pointer;border-radius:10px}
.pvnav.l{left:max(8px,env(safe-area-inset-left,0px))} .pvnav.r{right:max(8px,env(safe-area-inset-right,0px))}
@media (hover:none){.pvnav{display:none}}
.pvsel{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:5px 8px;font-size:14px;max-width:70%}
.pvsel option{color:#111}
.albgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.alb{border:0;padding:0;background:none;text-align:left;cursor:pointer;display:grid;gap:3px;min-width:0;color:var(--ink)}
.alb .cover{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;max-width:100%;box-shadow:var(--shadow)}

.alb small{color:var(--muted);font-size:12px}

.ph .tick{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;font:700 13px/18px var(--f-body);text-align:center}
.ph.sel .tick{background:var(--accent)}

/* abertura: os três viajantes atravessam a tela */
#intro{position:fixed;inset:0;z-index:80;background:#F7C98E;overflow:hidden;transition:opacity .45s ease}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:100%;height:100%;display:block}
#introSkip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:rgba(122,31,22,.85);color:#fff;font:700 13px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
#intro .walker{animation:walk 4.6s linear forwards}
#intro .bob{animation:bob .24s ease-in-out infinite alternate}
#intro .leg,#intro .arm{transform-box:fill-box;transform-origin:50% 4%;animation:swing .48s ease-in-out infinite alternate}
#intro .leg.b,#intro .arm.b{animation-delay:-.48s}
#intro .wheel{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}
#intro .case{animation:rattle .24s ease-in-out infinite alternate}
#intro .lantern{transform-box:fill-box;transform-origin:50% 0;animation:sway 1.6s ease-in-out infinite alternate}
#intro .lantern:nth-of-type(2n){animation-delay:-.8s}
#intro .cloud{animation:drift 9s linear infinite}
#intro .title{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.6,.4,1) .15s both}
#intro .sub{animation:rise .6s ease-out .55s both}
#intro .stamp{transform-box:fill-box;transform-origin:center;animation:stamp .45s cubic-bezier(.2,1.8,.4,1) 2.6s both}
#intro .petal{animation:fall linear infinite}
#intro .spark{transform-box:fill-box;transform-origin:center;animation:burst 1.4s ease-out infinite}
@keyframes walk{from{transform:translateX(-250px)}to{transform:translateX(400px)}}
#intro .panda{animation:chase 4.6s linear forwards}
#intro .pbob{animation:bob .17s ease-in-out infinite alternate}
#intro .pleg{transform-box:fill-box;transform-origin:50% 8%;animation:swing .3s ease-in-out infinite alternate}
#intro .pleg.b{animation-delay:-.3s}
@keyframes chase{from{transform:translateX(-380px)}to{transform:translateX(250px)}}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes swing{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rattle{to{transform:translateY(-1.5px) rotate(-1.5deg)}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{from{transform:scale(2.6) rotate(18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes fall{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(-40px,760px) rotate(540deg)}}
@keyframes burst{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#intro *{animation:none!important}#intro .walker{transform:translateX(70px)}#intro .panda{transform:translateX(-30px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
// O roteiro não fica no código (o repositório é público): vem da tabela "trip" do Supabase depois do login
// e fica guardado no aparelho para abrir sem internet.
let TRIP = null, DAYS = [];
const EN = {sha:"Shanghai", suz:"Suzhou", wx:"Shangrao Jiangxi", zjj:"Zhangjiajie", furong:"Furong Town Hunan", fh:"Fenghuang", ctu:"Chengdu", xian:"Xi'an", pek:"Beijing"};
const WD = ["dom","seg","ter","qua","qui","sex","sáb"], WDL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const TYPES = {passeio:"Passeio", comida:"Comida", compras:"Compras", transporte:"Transporte", trem:"Trem", nota:"Nota", hotel:"Hotel"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gm = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
// Mapas: na China o app que funciona é o Amap (高德地图). O link uri.amap.com abre o app se estiver instalado
// (callnative=1) ou a página do Amap. A busca é feita pelo nome em chinês, dentro da cidade certa.
const ZH_CITY = {sha:"上海", suz:"苏州", wx:"上饶", zjj:"张家界", furong:"永顺县", fh:"凤凰县", ctu:"成都", xian:"西安", pek:"北京"};
const AMAP_ZH = { // consulta usada no roteiro → "nome em chinês|cidade" (cidade só quando é outra)
  "The Bund Shanghai":"外滩", "Nanjing Road Pedestrian Street Shanghai":"南京路步行街", "Yu Garden Shanghai":"豫园",
  "Huxinting Teahouse Yu Garden":"湖心亭茶楼", "Wukang Road Shanghai":"武康路", "Tianzifang Shanghai":"田子坊",
  "Shanghai Tower Observation Deck":"上海中心大厦观光厅", "Shanghai Circus World ERA Intersection of Time":"上海马戏城",
  "Shanghai Museum People's Square":"上海博物馆人民广场馆", "Shiliupu Wharf Huangpu River Cruise":"十六铺码头",
  "Xintiandi Shanghai":"新天地", "Shanghai Wild Animal Park":"上海野生动物园", "Zhujiajiao Water Town":"朱家角古镇",
  "West Lake Hangzhou":"西湖|杭州", "59 Yunnan North Road Huangpu Shanghai":"云南北路59号",
  "Humble Administrator's Garden Suzhou":"拙政园", "Suzhou Museum":"苏州博物馆", "Pingjiang Road Suzhou":"平江路",
  "Lingering Garden Suzhou":"留园", "Shantang Street Suzhou":"山塘街",
  "Wangxian Valley Shangrao Jiangxi":"望仙谷|上饶",
  "Wulingyuan Gate Zhangjiajie National Forest Park":"武陵源门票站", "Bailong Elevator Zhangjiajie":"百龙天梯",
  "Tianmen Mountain Cableway Station Zhangjiajie":"天门山索道", "Zhangjiajie Grand Canyon Glass Bridge":"张家界大峡谷玻璃桥",
  "Charming Xiangxi Theater Zhangjiajie":"魅力湘西大剧院", "Wulingyuan Biaozhimen Zhangjiajie":"武陵源标志门",
  "Fenghuang Ancient Town Tuojiang":"凤凰古城|凤凰县",
  "Kuanzhai Alley Chengdu":"宽窄巷子", "Jinli Ancient Street Chengdu":"锦里古街", "Wenshu Monastery Chengdu":"文殊院",
  "Heming Teahouse People's Park Chengdu":"人民公园鹤鸣茶社", "Shufeng Yayun Sichuan Opera Chengdu":"蜀风雅韵",
  "48 Shuinianhe Road Jinjiang Chengdu":"水碾河路48号",
  "Bell Tower Xi'an":"西安钟楼", "Muslim Quarter Xi'an":"回民街", "Datang Everbright City Xi'an":"大唐不夜城",
  "Emperor Qinshihuang's Mausoleum Site Museum Terracotta Army":"秦始皇帝陵博物院", "South Gate Yongning Gate Xi'an City Wall":"永宁门",
  "Shuyuanmen Xi'an":"书院门", "Tang Dynasty Palace Show Xi'an":"唐乐宫", "Zhuque Gate Xi'an city wall":"朱雀门",
  "Tiananmen Square Beijing":"天安门广场", "Palace Museum Forbidden City Beijing":"故宫博物院", "Jingshan Park Beijing":"景山公园",
  "Summer Palace Beijing":"颐和园", "Temple of Heaven Beijing":"天坛公园", "Hongqiao Pearl Market Beijing":"红桥市场",
  "Nanluoguxiang Beijing":"南锣鼓巷", "Wangfujing Street Beijing":"王府井步行街", "Mutianyu Great Wall":"慕田峪长城|北京",
  "Red Theatre Beijing Legend of Kung Fu":"红剧场", "Beijing International Hotel Jianguomennei":"北京国际饭店"
};
const amap = (kw, cityName) => `https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}${cityName ? "&city=" + encodeURIComponent(cityName) : ""}&view=map&src=china2026&callnative=1`;
// botões de mapa: Amap (principal) + Google (reserva). zh = nome em chinês, quando já existe (restaurantes, hotéis, itens novos)
function mapBtns(url, city, zh){
  const m = url && url.match(/google\.com\/maps\/search\/\?api=1&query=([^&]+)/), q = m ? decodeURIComponent(m[1]) : "";
  if(!url && !zh) return "";
  if(!m && !zh) return `<a class="pill" href="${esc(url)}" target="_blank" rel="noopener">Site oficial</a>`;
  const [kw, c] = zh ? [zh] : (AMAP_ZH[q] || q).split("|");
  return `<a class="pill pri" href="${esc(amap(kw, c || ZH_CITY[city] || ""))}" target="_blank" rel="noopener">高德 Amap</a>${m ? `<a class="pill" href="${esc(url)}" target="_blank" rel="noopener">Google</a>` : ""}`;
}
const hm = t => { const m = String(t || "").match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : -1; };
const dd = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtD = iso => { const d = dd(iso); return `${d.getDate()}/${String(d.getMonth() + 1).padStart(2, "0")}`; };
const ls = { get(k, f){ try{ const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); }catch(e){ return f; } },
             set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

// Hora local da China (UTC+8) e do Brasil (UTC−3), independente do fuso do celular
function zoneNow(tz){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone:tz, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(new Date()).map(x => [x.type, x.value]));
  return {iso:`${p.year}-${p.month}-${p.day}`, hm:`${p.hour}:${p.minute}`, min:+p.hour * 60 + +p.minute};
}
function tick(){
  const cn = zoneNow("Asia/Shanghai"), br = zoneNow("America/Sao_Paulo");
  $("#cnTime").textContent = cn.hm; $("#brTime").textContent = `China · Brasil ${br.hm}`;
  return cn;
}

/* ---------- Supabase: login, roteiro e edições compartilhadas ---------- */
// Tabela "edits": uma linha por item alterado ou criado (id, body, author).
// Itens do roteiro original: id "<dia>~h<n>" com {t,title,note,hidden,done}. Itens novos: id "n-<...>" com {kind:"new", day, type, t, title, note, place, zh}.
const CFG = window.APP_CONFIG || {};
const configured = !!(window.supabase && CFG.SUPABASE_URL && /^https:\/\//.test(CFG.SUPABASE_URL) && CFG.SUPABASE_ANON_KEY && !/COLE/.test(CFG.SUPABASE_ANON_KEY));
const sb = configured ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
// server = o que está no banco; pending = o que este aparelho mudou e ainda não enviou (sobrevive sem internet)
const S = {server:ls.get("guia26.server", {}), pending:ls.get("guia26.pending", {}), edits:{}, me:null, profile:null, profiles:ls.get("guia26.profiles", {}), online:false, readonly:false};
function setSync(kind, txt){ $("#syncTxt").innerHTML = `<span class="sync ${kind}"></span>${esc(txt)}`; }
function recompute(){
  const e = {...S.server};
  Object.entries(S.pending).forEach(([id, v]) => { if(v === null) delete e[id]; else e[id] = {...v, _by:S.me?.id}; });
  S.edits = e;
}
function syncLabel(){
  const n = Object.keys(S.pending).length;
  if(!navigator.onLine) setSync("warn", n ? `sem internet · ${n} alteração(ões) para enviar` : "sem internet · cópia salva no aparelho");
  else if(n) setSync("warn", `enviando ${n} alteração(ões)…`);
  else setSync(S.online ? "ok" : "warn", S.online ? "sincronizado com o grupo" : "conectando…");
}
const rowToEdit = r => ({...(r.body || {}), _by:r.author});
async function loadEdits(){
  const {data, error} = await sb.from("edits").select("id, body, author");
  if(error) throw error;
  S.server = {}; data.forEach(r => S.server[r.id] = rowToEdit(r)); ls.set("guia26.server", S.server);
}
async function loadProfiles(){
  const {data} = await sb.from("profiles").select("id, name, color, settings");
  if(!data) return;
  S.profiles = {}; data.forEach(p => S.profiles[p.id] = {name:p.name, color:p.color}); ls.set("guia26.profiles", S.profiles);
  S.profile = data.find(p => p.id === S.me.id) || null;
}
async function loadTrip(){
  const {data, error} = await sb.from("trip").select("data").eq("id", "main").maybeSingle();
  if(error) throw error;
  if(data && data.data){ setTrip(data.data); ls.set("guia26.trip", data.data); }
}
function setTrip(t){ TRIP = t; DAYS = t.days || []; if(cur >= DAYS.length) cur = 0; }
let flushing = false;
async function flush(){
  if(flushing || !sb || !navigator.onLine || !S.me) return;
  flushing = true;
  try{
    for(const [id, v] of Object.entries(S.pending)){
      const r = v === null ? await sb.from("edits").delete().eq("id", id)
        : await sb.from("edits").upsert({id, body:v, author:S.me.id, updated_at:new Date().toISOString()});
      if(r.error){
        if(/permission|policy|42501/i.test(r.error.message + r.error.code)){ delete S.pending[id]; toast("Sem permissão para editar o roteiro."); }
        else break; // rede: tenta de novo quando a conexão voltar
      } else {
        if(v === null) delete S.server[id]; else S.server[id] = {...v, _by:S.me.id};
        delete S.pending[id];
      }
    }
  } finally { flushing = false; ls.set("guia26.pending", S.pending); ls.set("guia26.server", S.server); recompute(); syncLabel(); }
}
function saveEdit(id, data){
  if(data){ const {_by, ...clean} = data; data = clean; }
  S.pending[id] = data || null; ls.set("guia26.pending", S.pending);
  recompute(); render(); syncLabel(); flush();
}
const patchBase = (key, patch) => { const {_by, ...cur} = S.edits[key] || {}; saveEdit(key, {...cur, ...patch, at:Date.now()}); };
let channel = null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("edits-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"edits"}, p => {
      if(p.eventType === "DELETE") delete S.server[p.old.id]; else S.server[p.new.id] = rowToEdit(p.new);
      ls.set("guia26.server", S.server); recompute(); render();
    })
    .subscribe(st => { S.online = st === "SUBSCRIBED"; syncLabel(); });
}
async function refreshAll(){
  if(!navigator.onLine || !S.me) return;
  try{ await Promise.all([loadTrip(), loadEdits(), loadProfiles()]); recompute(); if(DAYS.length){ buildStrip(); } render(); await flush(); }
  catch(e){ setSync("err", "não deu para sincronizar agora"); }
}

/* ---------- Itens do dia ---------- */
const MEAL = /almo[cç]o|jantar|caf[eé] da manh|lanche/i;
function typeOf(x){
  if(/^🛍/.test(x)) return "compras";
  if(/^Trem |^Chegada à estação|^Chegar à estação/.test(x)) return "trem";
  if(/^(Pouso|Voo|Check-in do voo)/.test(x)) return "transporte";
  if(MEAL.test(x) && !/^(Metrô|Didi|Táxi)/.test(x)) return "comida";
  if(/^(Check-in|Check-out|Pegar as malas|Separar|Entregar as malas|Dormir|Descanso)/.test(x)) return "hotel";
  if(/^(Metrô|Didi|Táxi|Carro|Maglev|Ônibus|Volta|Caminhar|7 min a pé|10 min a pé)|Didi|Metrô linha/.test(x)) return "transporte";
  return "passeio";
}
function dayItems(d){
  const items = [];
  d.h.forEach(([t, x, url], i) => items.push({key:`${d.id}~h${i}`, base:true, t, title:x.replace(/^🛍\s*/, ""), type:typeOf(x), url, opts:[]}));
  // restaurantes sugeridos entram como opções da refeição mais próxima; sem refeição perto, viram item próprio
  d.r.forEach(([t, meal, name, zh, desc, near, price], i) => {
    const r = {name, zh, desc, near, price, meal, url:gm((zh || name) + " " + EN[d.city])};
    const m = hm(t);
    const host = items.filter(x => x.type === "comida" || MEAL.test(x.title)).sort((a, b) => Math.abs(hm(a.t) - m) - Math.abs(hm(b.t) - m))[0];
    if(host && Math.abs(hm(host.t) - m) <= 60) host.opts.push(r);
    else items.push({key:`${d.id}~r${i}`, base:true, t, title:name, type:"comida", note:desc, place:near, zh, url:r.url, opts:[], rest:r});
  });
  items.forEach(it => { const e = S.edits[it.key]; if(e){ it.orig = {t:it.t, title:it.title}; ["t","title","note","hidden","done"].forEach(k => { if(e[k] !== undefined && e[k] !== "") it[k] = e[k]; }); it.edited = !!(e.t || e.title || e.note); it.by = e._by; } });
  Object.entries(S.edits).forEach(([id, e]) => { if(e.kind === "new" && e.day === d.id) items.push({key:id, base:false, by:e._by, t:e.t || "", title:e.title || "(sem título)", type:e.type || "passeio", note:e.note || "", place:e.place || "", zh:e.zh || "", done:!!e.done, opts:[], url:e.place || e.zh ? gm((e.zh || e.place) + " " + EN[d.city]) : ""}); });
  return items.sort((a, b) => { const x = hm(a.t), y = hm(b.t); return (x < 0 ? 9999 : x) - (y < 0 ? 9999 : y); });
}

// Pronúncia: voz chinesa do próprio celular (Web Speech); sem voz chinesa no aparelho, a voz do Claude (capability tts).
const NATIVE = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let ttsCap = null, TTS = NATIVE;
(async () => { ttsCap = null; // fora do Claude não há voz extra: só a voz chinesa do celular
  if(ttsCap && !TTS){ TTS = true; if(tab === "frases") renderPhrases(); } })();
let zhVoice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang) && !/HK|TW/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null; }catch(e){} }
if(NATIVE){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
let speakingBtn = null;
function say(zh, btn, slow){
  if(!TTS) return;
  if(NATIVE) pickVoice();
  if(!zhVoice && ttsCap){
    try{ NATIVE && speechSynthesis.cancel(); ttsCap.stop(); }catch(e){}
    if(speakingBtn){ speakingBtn.classList.remove("on"); if(speakingBtn === btn){ speakingBtn = null; return; } }
    speakingBtn = btn || null; btn && btn.classList.add("on");
    const end = () => { btn && btn.classList.remove("on"); if(speakingBtn === btn) speakingBtn = null; };
    ttsCap.speak(zh, {language:"zh", rate:slow ? 0.7 : 0.9}).then(end, e => { end(); if(e && e.code !== "viewer_stopped" && e.code !== "busy") toast(e && e.code === "not_granted" ? "A voz está desligada neste guia." : "Não foi possível tocar o áudio agora."); });
    return;
  }
  if(!NATIVE) return;
  try{
    speechSynthesis.cancel();
    if(speakingBtn){ speakingBtn.classList.remove("on"); if(speakingBtn === btn){ speakingBtn = null; return; } }
    const u = new SpeechSynthesisUtterance(zh);
    u.lang = zhVoice ? zhVoice.lang : "zh-CN"; if(zhVoice) u.voice = zhVoice; u.rate = slow ? 0.55 : 0.8;
    speakingBtn = btn || null; btn && btn.classList.add("on");
    const end = () => { btn && btn.classList.remove("on"); if(speakingBtn === btn) speakingBtn = null; };
    u.onend = end; u.onerror = () => { end(); toast("Este celular não tem voz em chinês instalada. No iPhone: Ajustes › Acessibilidade › Conteúdo falado › Vozes › Chinês."); };
    speechSynthesis.speak(u);
  }catch(e){ toast("Não foi possível tocar o áudio neste aparelho."); }
}

  if(vv){ fit(); vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); }
  document.body.style.overflow = "hidden";
  let type = v.type;
  const close = () => { if(vv){ vv.removeEventListener("resize", fit); vv.removeEventListener("scroll", fit); } document.body.style.overflow = ""; $("#layer").innerHTML = ""; };
  $("#scrim").onclick = e => { if(e.target.id === "scrim") close(); };

    }
    close(); if(isNew) toast("Adicionado ao roteiro.");

const b64u = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function currentSub(){ if(!pushOK) return null; try{ const r = await navigator.serviceWorker.getRegistration(); return r ? await r.pushManager.getSubscription() : null; }catch(e){ return null; } }
async function enablePush(){
  if(!pushOK){ toast(isIOS && !standalone ? "No iPhone, primeiro adicionem o guia à Tela de Início." : "Este navegador não recebe notificações."); return; }
  if(!CFG.VAPID_PUBLIC_KEY){ toast("Falta a chave de notificações no config.js."); return; }
  const perm = await Notification.requestPermission();
  if(perm !== "granted"){ toast("Notificações bloqueadas. Liberem nas configurações do navegador para este site."); renderAccount(); return; }
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(CFG.VAPID_PUBLIC_KEY)});
    const j = sub.toJSON();
    const {error} = await sb.from("push_subs").upsert({endpoint:j.endpoint, user_id:S.me.id, sub:j, device:navigator.userAgent.slice(0, 160)});
    if(error) throw error;
    toast("Notificações ativadas neste aparelho.");
  }catch(e){ toast("Não deu para ativar: " + (e.message || "erro desconhecido")); }
  renderAccount();
}
async function disablePush(){
  const sub = await currentSub();
  if(sub){ await sb.from("push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  toast("Notificações desligadas neste aparelho."); renderAccount();
}

/* ---------- Fotos da viagem ---------- */
// Tabela "photos" + bucket privado "fotos" no Supabase. Cada foto sobe em duas versões: até 2048 px e miniatura de 480 px.
const PH = {list:null, albums:[], urls:{}, full:{}, day:"all", busy:0, sub:null, vlist:[], view:-1,
  mode:"dias", album:null, picking:null, creating:false, renaming:false, delArmed:false};
const dayById = id => DAYS.find(d => d.id === id);
async function signUrls(paths){
  const now = Date.now(), need = [...new Set(paths)].filter(p => p && (!PH.urls[p] || PH.urls[p].exp < now + 120e3));
  for(let i = 0; i < need.length; i += 100){
    const {data} = await sb.storage.from("fotos").createSignedUrls(need.slice(i, i + 100), 6 * 3600);
    (data || []).forEach(d => { if(d.signedUrl) PH.urls[d.path] = {u:d.signedUrl, exp:now + 6 * 3600e3}; });
  }
}
const purl = p => (PH.urls[p] || {}).u || "";
async function loadPhotos(){
  const [{data, error}, al] = await Promise.all([
    sb.from("photos").select("id, path, thumb, day, caption, author, created_at, w, h, album_id").order("created_at", {ascending:false}),
    sb.from("albums").select("id, name, created_by, created_at").order("created_at")]);
  if(error){ PH.list = PH.list || []; toast("Não deu para carregar as fotos agora."); }
  else { PH.list = data; PH.albums = al.data || []; await signUrls(data.map(p => p.thumb)); }
  if(tab === "fotos" && PH.view < 0) renderPhotos();
}
function photosSubscribe(){
  if(PH.sub) return;
  PH.sub = sb.channel("photos-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"photos"}, () => loadPhotos())
    .on("postgres_changes", {event:"*", schema:"public", table:"albums"}, () => loadPhotos()).subscribe();
}
// dia de destino de uma foto nova: o dia escolhido no filtro; sem filtro, o dia de hoje da viagem
const uploadDay = () => PH.day !== "all" && PH.day !== "_" ? PH.day : (DAYS[todayIdx()] || {}).id || null;
async function shrink(file, max, q){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("formato de imagem não suportado")); i.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  if(!blob) throw new Error("não deu para converter a foto");
  return {blob, w:c.width, h:c.height};
}
async function uploadFiles(files, albumId = null){
  const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if(!arr.length) return;
  if(!navigator.onLine){ toast("Sem internet: tentem enviar as fotos quando a conexão voltar."); return; }
  const day = uploadDay(); let ok = 0;
  PH.busy += arr.length; renderPhotos();
  for(const f of arr){
    try{
      const full = await shrink(f, 2048, .86), th = await shrink(f, 480, .74);
      const id = crypto.randomUUID(), base = `${S.me.id}/${id}`;
      let r = await sb.storage.from("fotos").upload(base + ".jpg", full.blob, {contentType:"image/jpeg"}); if(r.error) throw r.error;
      r = await sb.storage.from("fotos").upload(base + "_t.jpg", th.blob, {contentType:"image/jpeg"}); if(r.error) throw r.error;
      r = await sb.from("photos").insert({id, path:base + ".jpg", thumb:base + "_t.jpg", day, w:full.w, h:full.h, author:S.me.id, album_id:albumId}); if(r.error) throw r.error;
      ok++;
    }catch(e){ toast(`“${f.name}” não subiu: ${e.message || "erro"}`); }
    PH.busy--; if(tab === "fotos" && PH.view < 0) renderPhotos();
  }
  const alb = albumId && PH.albums.find(a => a.id === albumId);
  if(ok) toast(`${ok} foto${ok > 1 ? "s" : ""} adicionada${ok > 1 ? "s" : ""}${alb ? ` em “${alb.name}”` : day && dayById(day) ? " em " + fmtD(dayById(day).date) : ""}.`);
  await loadPhotos();
}
async function getFull(p){
  if(PH.full[p.id]) return PH.full[p.id];
  await signUrls([p.path]);
  const b = await (await fetch(purl(p.path))).blob();
  const d = dayById(p.day);
  return PH.full[p.id] = new File([b], `china2026-${d ? d.date : "viagem"}-${p.id.slice(0, 6)}.jpg`, {type:"image/jpeg"});
}
// iPhone/Android: abre a folha de compartilhar (“Salvar imagem”); computador: baixa o arquivo
async function saveFiles(files){
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  files.forEach((f, i) => setTimeout(() => { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000); }, i * 250));
}

  let x0 = null; const area = $("#pvArea");
  area.ontouchstart = e => { x0 = e.touches[0].clientX; };
  area.ontouchend = e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50 && list.length > 1) step(dx < 0 ? 1 : -1); };
  if(!purl(p.path)) signUrls([p.path]).then(() => { const img = $("#pvImg"); if(img && PH.vlist[PH.view] === p) img.src = purl(p.path); });
  // a foto inteira é baixada já ao abrir, para o “Salvar” funcionar direto no toque
  if(!PH.full[p.id]) getFull(p).then(() => { const b = $("#pvSave"); if(b && PH.vlist[PH.view] === p) b.textContent = "Salvar no celular"; }).catch(() => {});
  if(editing){
    $("#pvCapIn").focus();
    $("#pvCapNo").onclick = () => drawViewer();
    $("#pvCapOk").onclick = async () => { const caption = $("#pvCapIn").value.trim(); const {error} = await sb.from("photos").update({caption}).eq("id", p.id); if(error){ toast("Não salvou a legenda."); return; } p.caption = caption; drawViewer(); };
    return;
  }
  $("#pvSave").onclick = async () => { const f = PH.full[p.id]; if(f){ saveFiles([f]); return; } $("#pvSave").textContent = "Preparando…"; try{ await getFull(p); $("#pvSave").textContent = "Pronto: toque para salvar"; }catch(e){ toast("Não deu para baixar a foto."); } };
  $("#pvCap") && ($("#pvCap").onclick = () => drawViewer(true));
  $("#pvAlb") && ($("#pvAlb").onchange = async e => {
    const id = e.target.value || null, {error} = await sb.rpc("set_photo_album", {p_photo:p.id, p_album:id});
    if(error){ toast("Não deu para mudar o álbum."); e.target.value = p.album_id || ""; return; }
    p.album_id = id; const src = PH.list.find(x => x.id === p.id); if(src) src.album_id = id;
    toast(id ? `Foto colocada em “${PH.albums.find(a => a.id === id).name}”.` : "Foto tirada do álbum.");
  });
  let armed = false;
  $("#pvDel") && ($("#pvDel").onclick = async () => {
    if(!armed){ armed = true; $("#pvDel").textContent = "Toque de novo para excluir"; return; }
    const r1 = await sb.from("photos").delete().eq("id", p.id);
    if(r1.error){ toast("Não deu para excluir."); return; }
    await sb.storage.from("fotos").remove([p.path, p.thumb]);
    PH.list = PH.list.filter(x => x.id !== p.id); list.splice(PH.view, 1); toast("Foto excluída.");
    if(!list.length) closeViewer(); else { PH.view = Math.min(PH.view, list.length - 1); drawViewer(); }
  });
}
document.addEventListener("keydown", e => { if(PH.view < 0) return; if(e.key === "ArrowRight" && PH.vlist.length > 1){ PH.view = (PH.view + 1) % PH.vlist.length; drawViewer(); } if(e.key === "ArrowLeft" && PH.vlist.length > 1){ PH.view = (PH.view - 1 + PH.vlist.length) % PH.vlist.length; drawViewer(); } if(e.key === "Escape") closeViewer(); });

  const lantern = (x, s) => `<g transform="translate(${x} 34)"><g class="lantern"><path d="M0 0 V${12 * s}" stroke="#7A1F16" stroke-width="1.5"/><g transform="translate(0 ${12 * s}) scale(${s})"><rect x="-8" y="-3" width="16" height="6" rx="2" fill="#E8B84A"/><ellipse cx="0" cy="20" rx="19" ry="21" fill="#D7322B"/><path d="M-12 20 Q0 6 12 20 Q0 34 -12 20" stroke="#B0241F" stroke-width="1.5" fill="none"/><path d="M0 0 V41" stroke="#B0241F" stroke-width="1.2"/><rect x="-8" y="38" width="16" height="6" rx="2" fill="#E8B84A"/><path d="M-3 44 L-4 60 M0 44 V62 M3 44 L4 60" stroke="#E8B84A" stroke-width="1.6"/><text x="0" y="26" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="15" fill="#F7D27A">福</text></g></g></g>`;
  const petals = Array.from({length:16}, (_, i) => `<circle class="petal" cx="${(i * 53 + 17) % 420}" cy="0" r="${2 + (i % 3)}" fill="${i % 2 ? "#E8505B" : "#F2C14E"}" style="animation-duration:${4 + (i % 5) * .7}s;animation-delay:${-(i * .37).toFixed(2)}s"/>`).join("");
  // panda em pé, correndo nas duas patas de trás atrás dos viajantes, com um bambu na mão (de frente, como eles; pés em y=170)
  const k = "#1E1C1B", w = "#F6F3EE";
  const panda = `<g class="panda"><g transform="translate(0 376) scale(1.08)"><g class="pbob">
    <g class="pleg b"><rect x="26" y="134" width="13" height="34" rx="6.5" fill="${k}"/><ellipse cx="32.5" cy="168" rx="9" ry="4.5" fill="${k}"/></g>
    <g class="pleg"><rect x="43" y="134" width="13" height="34" rx="6.5" fill="${k}"/><ellipse cx="49.5" cy="168" rx="9" ry="4.5" fill="${k}"/></g>
    <g class="pleg"><rect x="12" y="94" width="12" height="32" rx="6" fill="${k}"/></g>
    <ellipse cx="41" cy="116" rx="23" ry="27" fill="${w}" stroke="${k}" stroke-width="1.6"/>
    <path d="M19 104 Q22 88 41 88 Q60 88 63 104 Q52 98 41 98 Q30 98 19 104 Z" fill="${k}"/>
    <ellipse cx="41" cy="123" rx="12" ry="13" fill="#FFFFFF" opacity=".6"/>
    <g class="pleg b"><rect x="58" y="94" width="12" height="32" rx="6" fill="${k}"/><path d="M60 140 L76 78" stroke="#5E9E3A" stroke-width="5" stroke-linecap="round"/><path d="M62.5 130 L67 128 M66 116 L70.5 114 M69.5 102 L74 100 M72.5 89 L77 87" stroke="#3F7426" stroke-width="1.8"/><path d="M76 80 Q87 70 91 75 Q85 82 76 80 Z" fill="#7CC04F"/><path d="M75 84 Q66 76 64 81 Q69 86 75 84 Z" fill="#7CC04F"/><circle cx="64" cy="122" r="6.5" fill="${k}"/></g>
    <circle cx="23" cy="50" r="9" fill="${k}"/><circle cx="59" cy="50" r="9" fill="${k}"/>
    <ellipse cx="41" cy="68" rx="25" ry="23" fill="${w}" stroke="${k}" stroke-width="1.6"/>
    <ellipse cx="32" cy="66" rx="6.5" ry="8.5" fill="${k}" transform="rotate(28 32 66)"/><ellipse cx="50" cy="66" rx="6.5" ry="8.5" fill="${k}" transform="rotate(-28 50 66)"/>
    <circle cx="33" cy="65" r="2.8" fill="#fff"/><circle cx="49" cy="65" r="2.8" fill="#fff"/><circle cx="33.6" cy="65.4" r="1.4" fill="${k}"/><circle cx="49.6" cy="65.4" r="1.4" fill="${k}"/>
    <ellipse cx="41" cy="75" rx="4" ry="2.8" fill="${k}"/>
    <path d="M41 77.5 V80 M36 80 Q38.5 83.5 41 80 Q43.5 83.5 46 80" stroke="${k}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M37.5 82 Q41 88 44.5 82 Q41 83.5 37.5 82 Z" fill="#E06B6B"/>
    <circle cx="26" cy="77" r="3.4" fill="#F3A4A4" opacity=".6"/><circle cx="56" cy="77" r="3.4" fill="#F3A4A4" opacity=".6"/>
    <path d="M9 64 l-7 -2 M10 72 l-7 1 M12 56 l-6 -5" stroke="#B3362A" stroke-width="2.2" stroke-linecap="round"/>
  </g></g></g>`;
  const walkers = panda + TRAVELERS_DETAILED.map((o, i) => `<g class="walker"><g transform="translate(${230 - i * 118} 373) scale(1.12)"><g class="bob" style="animation-delay:${(-i * .09).toFixed(2)}s">${traveler(o)}</g></g></g>`).join("");
  return `<defs><linearGradient id="isky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7C4"/><stop offset=".55" stop-color="#F8C27E"/><stop offset="1" stop-color="#F09A62"/></linearGradient></defs>
    <rect width="400" height="720" fill="url(#isky)"/>

    <g class="sub"><text x="200" y="212" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="30" fill="#B3362A" letter-spacing="6">一路顺风</text>
      <text x="200" y="238" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-weight="600" font-size="13.5" fill="#7A1F16">boa viagem! · Xangai → Pequim · 9 a 30/12</text></g>
    ${walkers}
    <g transform="translate(200 660)"><g class="stamp"><rect x="-30" y="-30" width="60" height="60" rx="8" fill="#B3362A"/><text x="0" y="13" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="38" fill="#FFF3E0">游</text></g></g>
    ${petals}`;
}
let introPlayed = false;
function playIntro(){
  if(introPlayed) return; introPlayed = true;
  const el = $("#intro"); $("#introSvg").innerHTML = introScene(); el.hidden = false; el.classList.remove("out"); el.style.opacity = "1";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let done = false;
  const end = () => { if(done) return; done = true; el.classList.add("out"); el.style.opacity = "0"; setTimeout(() => { el.hidden = true; $("#introSvg").innerHTML = ""; }, 460); };
  setTimeout(end, reduce ? 1600 : 4500);
  el.onclick = end;
}

/* ---------- Início ---------- */
async function startApp(user){
  playIntro();
  S.me = user;
  $("#auth").hidden = true; $("#app").hidden = false; $("#tabs").hidden = false;
  const cached = ls.get("guia26.trip", null); if(cached) setTrip(cached);
  recompute(); syncLabel();
  const q = new URLSearchParams(location.search).get("day");
  const pick = () => { const qi = q ? DAYS.findIndex(d => d.id === q) : -1, t = todayIdx(), saved = ls.get("guia26.day", 0);
    cur = qi >= 0 ? qi : t >= 0 ? t : Math.min(Math.max(0, saved | 0), Math.max(0, DAYS.length - 1)); };
  pick(); if(DAYS.length) buildStrip(); render();
  if(navigator.onLine){ await refreshAll(); if(!cached){ pick(); buildStrip(); render(); } }
  if(!S.profile && S.profiles[S.me.id]) S.profile = S.profiles[S.me.id];
  subscribe();
  setTimeout(() => $("#strip").querySelector(`[data-i="${cur}"]`)?.scrollIntoView({inline:"center", block:"nearest"}), 0);
  // links das notificações: ?tab=fotos&album=<id> abre o álbum
  const qs = new URLSearchParams(location.search);
  if(qs.get("tab") === "fotos"){ const alb = qs.get("album"); if(alb){ PH.mode = "albuns"; PH.album = alb; } setTab("fotos"); }
  if(q || qs.get("tab")) history.replaceState(null, "", location.pathname);
}
async function boot(){
  tick(); setInterval(() => { tick(); if(S.me && tab === "dia" && DAYS.length && !$("#layer").innerHTML && DAYS[cur].date === zoneNow("Asia/Shanghai").iso) renderDay(); }, 60000);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if(!sb){ showAuth("O app ainda não foi ligado ao Supabase: preencham o config.js (veja o README)."); $("#aBtn").disabled = true; return; }
  sb.auth.onAuthStateChange((ev, s) => { if(ev === "SIGNED_OUT") showAuth(); });
  const {data} = await sb.auth.getSession();
  if(data.session) startApp(data.session.user); else showAuth();
}
boot();
